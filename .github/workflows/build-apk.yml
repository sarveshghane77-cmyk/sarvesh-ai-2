name: Build SARVESH AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SARVESH AI project
        run: |
          mkdir -p extracted
          unzip -q SarveshAI.zip -d extracted

          echo "Searching for SARVESH AI project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if node -e "
              const p=require('./$file');
              process.exit(
                p.scripts && p.scripts.build ? 0 : 1
              )
            " 2>/dev/null; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name package.json)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find the project package.json"
            echo "Files found:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "SARVESH AI project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload SARVESH AI APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVESH-AI-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
