name: Build SARVESH AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SARVESH AI project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q SarveshAI.zip -d extracted

          PROJECT_DIR=""

          for dir in $(find extracted -type f -name package.json -not -path "*/node_modules/*" -exec dirname {} \;); do
            if [ -f "$dir/capacitor.config.ts" ] || [ -f "$dir/capacitor.config.json" ]; then
              if [ -d "$dir/android" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: SARVESH AI project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf node_modules
          npm install

      - name: Fix executable permissions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x node_modules/.bin/*
          chmod +x node_modules/vite/bin/vite.js

      - name: Build SARVESH AI
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          SDK_DIR=$(dirname "$SDKMANAGER")
          echo "$SDK_DIR" >> "$GITHUB_PATH"

          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload SARVESH AI APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVESH-AI-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
